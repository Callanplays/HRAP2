name: Release Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build versioned Windows zip
        run: python packaging/build_windows.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRAP-windows
          path: dist/HRAP-HCAT-Fork-*-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HRAP-HCAT-Fork-*-windows.zip
          generate_release_notes: true
          name: HRAP (HCAT Fork) ${{ github.ref_name }}
          draft: false
          prerelease: false
